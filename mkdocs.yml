site_name: PgBouncer Manager
site_url: https://predicta-online.github.io/pgbouncer-manager/
repo_url: https://github.com/Predicta-Online/pgbouncer-manager
repo_name: Predicta-Online/pgbouncer-manager

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quick-start.md
  - API Reference: api.md
  - CLI: cli.md
  - Deployment:
    - Docker: deployment/docker.md
    - Kubernetes: deployment/kubernetes.md
    - Bare Metal: deployment/bare-metal.md
  - Security: security.md
  - Contributing: contributing.md

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - glightbox
  - search

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.arithmatex
  - pymdownx.betterem
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji
  - pymdownx.inlinehilite
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Predicta-Online
    - icon: fontawesome/brands/docker
      link: https://hub.docker.com/r/predicta
