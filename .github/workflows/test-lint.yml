name: Test & Lint

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,operator]"

      - name: Lint with ruff
        run: ruff check app cli controller

      - name: Type check with mypy
        run: mypy app cli controller

      - name: Run tests
        run: pytest --cov=app --cov=cli --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4

  # The chart renders custom resources that the operator parses. Nothing else
  # in CI connects those two, so a values key renamed on one side and not the
  # other would otherwise only surface in a real cluster (see tests/test_chart.py).
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint chart
        run: helm lint charts/pgbouncer-manager

      - name: Render chart
        run: helm template test charts/pgbouncer-manager > /dev/null

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '23'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: |
          cd ui
          npm ci

      - name: Run linter
        run: |
          cd ui
          npm run lint

      - name: Run build
        run: |
          cd ui
          npm run build
