name: Build & Publish

# Builds and pushes the multi-arch image to Docker Hub, tagged with the full
# semver, the major.minor series, and `latest`.
#
# This workflow does not react to release events. It is called by release.yml in
# the same run that cuts the release (see the note there about GITHUB_TOKEN not
# triggering downstream workflows). workflow_dispatch is for manual re-runs of a
# tag that already exists.
on:
  workflow_call:
    inputs:
      ref:
        description: 'Version tag to build, e.g. v2.1.0'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: 'Version tag to build, e.g. v2.1.0'
        required: true
        type: string

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: adamsokode/pgbouncer-manager
          # `value` is passed explicitly because the checked-out ref of a called
          # workflow is still the caller's branch, so semver cannot be inferred.
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.ref }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.ref }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
