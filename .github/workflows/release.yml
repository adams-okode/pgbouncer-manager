name: Release

# Cut a release by pushing a version tag:
#   git tag v1.2.0 && git push origin v1.2.0
# This creates a GitHub Release, which is what triggers Build & Publish
# (build.yml) to produce and push artifacts.
#
# NOTE: a release created with the default GITHUB_TOKEN does NOT trigger other
# workflows (GitHub guards against recursive runs). To auto-trigger build.yml,
# set a RELEASE_PAT secret (a PAT with `contents: write`). Without it, the
# release is still created — just publish it from the GitHub UI / `gh release
# create`, or run build.yml manually, to kick off the build.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
