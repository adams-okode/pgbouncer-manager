name: Release

# Releases are cut by release-please, not by hand-pushed tags.
#
# Every push to main updates (or opens) a "chore(main): release X.Y.Z" PR that
# collects the conventional commits since the last release. Merging that PR is
# the act of releasing: release-please then bumps pyproject.toml +
# ui/package.json, writes CHANGELOG.md, tags vX.Y.Z and publishes the GitHub
# Release.
#
# The publish job runs in THIS SAME workflow run rather than reacting to the
# release event, because tags and releases created with the default
# GITHUB_TOKEN deliberately do not trigger other workflows. Chaining
# release -> build via events would need a PAT; calling build.yml directly does
# not.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.release-please.outputs.tag }}
    secrets: inherit
