[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

; Shared with the manager container, which uses it to reach the admin console.
; PgBouncer grants admin access over a unix socket based on the peer's uid, so
; running both as uid 1100 means RELOAD needs no password anywhere.
unix_socket_dir = /var/run/pgbouncer

; Clients must prove who they are. The manager writes matching SCRAM verifiers
; into userlist.txt whenever a tenant is created or its password rotated.
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
admin_users = pgbouncer
stats_users = pgbouncer

; Encrypt the pooler-to-Postgres leg. `require` encrypts but does not verify
; the server; use verify-full with a server_tls_ca_file in production.
server_tls_sslmode = require

pool_mode = transaction
max_client_conn = 1000
default_pool_size = 20
ignore_startup_parameters = extra_float_digits

; Do not log query text; it routinely contains personal data.
log_connections = 1
log_disconnections = 1

; The manager owns this file; PgBouncer re-reads it on RELOAD.
%include /etc/pgbouncer/databases.ini
