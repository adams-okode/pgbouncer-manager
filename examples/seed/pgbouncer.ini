[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

; auth_type = trust is used here so this example stays minimal (no backend
; password juggling). The manager still writes real SCRAM-SHA-256 verifiers into
; userlist.txt — to actually enforce them, switch auth_type to scram-sha-256 and
; make the backend credentials line up. See examples/README.md.
auth_type = trust
auth_file = /etc/pgbouncer/userlist.txt
admin_users = pgbouncer

pool_mode = transaction
max_client_conn = 100
default_pool_size = 20
ignore_startup_parameters = extra_float_digits

; The manager owns this file; PgBouncer re-reads it on RELOAD.
%include /etc/pgbouncer/databases.ini
