[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pgbouncer-manager"
version = "1.0.0"
description = "Manage PgBouncer tenants, pool sizes, and credentials with a FastAPI backend and CLI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "adams-okode" }]
dependencies = [
    "fastapi==0.115.0",
    "uvicorn==0.32.0",
    "pydantic==2.9.0",
    "python-dotenv==1.0.1",
    "cryptography==43.0.0",
]

[project.urls]
Homepage = "https://github.com/adams-okode/pgbouncer-manager"
Documentation = "https://adams-okode.github.io/pgbouncer-manager/"
Repository = "https://github.com/adams-okode/pgbouncer-manager"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.27",
]

[project.scripts]
pgbouncer-manager = "cli.tenant:main"

[tool.setuptools]
packages = ["app", "app.routes", "cli"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
