[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pgbouncer-manager"
version = "2.1.0"
description = "Manage PgBouncer tenants, pool sizes, and credentials with a FastAPI backend and CLI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "adams-okode" }]
dependencies = [
    "fastapi==0.115.0",
    "uvicorn==0.32.0",
    "pydantic==2.9.0",
    "pydantic-settings==2.5.2",
    "python-dotenv==1.0.1",
]

[project.urls]
Homepage = "https://github.com/adams-okode/pgbouncer-manager"
Documentation = "https://adams-okode.github.io/pgbouncer-manager/"
Repository = "https://github.com/adams-okode/pgbouncer-manager"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6,<0.17",
    "mypy>=1.11",
    "httpx>=0.27",
]

[project.scripts]
pgbouncer-manager = "cli.tenant:main"

[tool.setuptools]
packages = ["app", "app.routes", "app.services", "cli"]
include-package-data = true

[tool.setuptools.package-data]
# The compiled SPA, produced by `npm run build` into app/static before packaging.
app = ["static/**/*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.flake8-bugbear]
# `Depends()` in an argument default is the standard FastAPI injection idiom, not a B008 bug.
extend-immutable-calls = ["fastapi.Depends"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
